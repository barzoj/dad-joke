name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Resolve tag version
        id: meta
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') {
            throw "expected tag starting with v, got $tag"
          }
          $version = $tag.Substring(1)
          $commit = (git rev-parse --short HEAD).Trim()
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Generate API (TypeSpec + oapi-codegen)
        run: |
          npm ci
          npm run generate:typespec
          New-Item -ItemType Directory -Force -Path gen/go/agentapi, gen/go/controlapi | Out-Null
          go generate ./api

      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Package release artifacts
        run: |
          .\scripts\package-release.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Commit "${{ steps.meta.outputs.commit }}" `
            -DistDir "dist" `
            -Tag "${{ steps.meta.outputs.tag }}"

      - name: Verify packaged binary version
        run: |
          $out = (& .\dist\dad-joke-windows-amd64.exe version | Out-String).Trim()
          $want = "dad-joke ${{ steps.meta.outputs.version }} (commit ${{ steps.meta.outputs.commit }})"
          Write-Host "got:  $out"
          Write-Host "want: $want"
          if ($out -ne $want) {
            throw "version output mismatch"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: dad-joke ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/dad-joke-windows-amd64.exe
            dist/dad-joke-windows-amd64.exe.sha256
            dist/manifest.json
