name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release-windows:
    name: Build & publish Windows release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Resolve tag version
        id: meta
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') {
            throw "expected tag starting with v, got $tag"
          }
          $version = $tag.Substring(1)
          $commit = (git rev-parse --short HEAD).Trim()
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Generate API (TypeSpec + oapi-codegen)
        run: |
          npm ci
          npm run generate:typespec
          New-Item -ItemType Directory -Force -Path gen/go/agentapi, gen/go/controlapi | Out-Null
          go generate ./api

      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Package release artifacts
        run: |
          .\scripts\package-release.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Commit "${{ steps.meta.outputs.commit }}" `
            -DistDir "dist" `
            -Tag "${{ steps.meta.outputs.tag }}"

      - name: Verify packaged binary version
        run: |
          $out = (& .\dist\dad-joke-windows-amd64.exe version | Out-String).Trim()
          $want = "dad-joke ${{ steps.meta.outputs.version }} (commit ${{ steps.meta.outputs.commit }})"
          Write-Host "got:  $out"
          Write-Host "want: $want"
          if ($out -ne $want) {
            throw "version output mismatch"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: dad-joke ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/dad-joke-windows-amd64.exe
            dist/dad-joke-windows-amd64.exe.sha256
            dist/manifest.json

  release-ghcr:
    name: Multi-arch GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve tag version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "${tag}" in
            v*) ;;
            *) echo "expected tag starting with v, got ${tag}" >&2; exit 1 ;;
          esac
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER}/dad-joke-server"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "image=${img}" >> "${GITHUB_OUTPUT}"
          echo "candidate=${img}:sha-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the multi-arch image ONCE to an immutable candidate tag. Smoke tests
      # and later promotion all use this exact digest (no rebuild).
      - name: Build & push multi-arch candidate
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2ea9 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.candidate }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate digest
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ -z "${digest}" || "${digest}" != sha256:* ]]; then
            echo "missing multi-arch digest from build-push-action" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "ref=${{ steps.meta.outputs.image }}@${digest}" >> "${GITHUB_OUTPUT}"
          echo "candidate digest: ${digest}"

      - name: Start Mongo for smoke
        run: |
          set -euo pipefail
          docker network create dj-release-smoke
          docker run -d --name dj-release-mongo --network dj-release-smoke \
            --health-cmd "mongosh --eval \"db.adminCommand('ping')\"" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            mongo:7
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' dj-release-mongo 2>/dev/null || echo starting)"
            if [[ "${status}" == "healthy" ]]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' dj-release-mongo)" = "healthy"

      - name: Smoke linux/amd64 from candidate digest
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          index_ref="${{ steps.digest.outputs.ref }}"
          # Resolve the platform blob digest from the verified multi-arch index.
          plat_digest="$(docker buildx imagetools inspect "${index_ref}" \
            --format '{{range .Manifest.Manifests}}{{if and (eq .Platform.OS "linux") (eq .Platform.Architecture "amd64")}}{{.Digest}}{{end}}{{end}}')"
          test -n "${plat_digest}"
          plat_ref="${img}@${plat_digest}"
          docker pull "${plat_ref}"
          arch="$(docker image inspect "${plat_ref}" --format '{{.Architecture}}')"
          user="$(docker image inspect "${plat_ref}" --format '{{.Config.User}}')"
          echo "Architecture=${arch} User=${user} digest=${plat_digest}"
          test "${arch}" = "amd64"
          case "${user}" in
            nonroot|nonroot:nonroot|65532|65532:65532) ;;
            *) echo "expected nonroot/65532, got ${user}" >&2; exit 1 ;;
          esac
          cid="$(docker run -d --name dj-release-server --platform linux/amd64 \
            --network dj-release-smoke \
            --read-only --tmpfs /tmp --user 65532:65532 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e DAD_JOKE_MONGODB_URI=mongodb://dj-release-mongo:27017 \
            -e DAD_JOKE_MONGODB_DATABASE=dadjoke \
            -e DAD_JOKE_HTTP_ADDR=:8080 \
            -e COOKIE_SECURE=false \
            -e ALLOW_SIGNUP=false \
            "${plat_ref}")"
          ok=0
          for i in $(seq 1 45); do
            ip="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${cid}")"
            if [[ -n "${ip}" ]] && docker run --rm --network dj-release-smoke curlimages/curl:8.12.1 \
              -fsS "http://${ip}/healthz" | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs "${cid}" || true
          test "${ok}" = "1"
          docker rm -f "${cid}" >/dev/null

      - name: Smoke linux/arm64 from candidate digest (QEMU)
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          index_ref="${{ steps.digest.outputs.ref }}"
          plat_digest="$(docker buildx imagetools inspect "${index_ref}" \
            --format '{{range .Manifest.Manifests}}{{if and (eq .Platform.OS "linux") (eq .Platform.Architecture "arm64")}}{{.Digest}}{{end}}{{end}}')"
          test -n "${plat_digest}"
          plat_ref="${img}@${plat_digest}"
          docker pull "${plat_ref}"
          arch="$(docker image inspect "${plat_ref}" --format '{{.Architecture}}')"
          user="$(docker image inspect "${plat_ref}" --format '{{.Config.User}}')"
          echo "Architecture=${arch} User=${user} digest=${plat_digest}"
          test "${arch}" = "arm64"
          case "${user}" in
            nonroot|nonroot:nonroot|65532|65532:65532) ;;
            *) echo "expected nonroot/65532, got ${user}" >&2; exit 1 ;;
          esac
          cid="$(docker run -d --name dj-release-server-arm --platform linux/arm64 \
            --network dj-release-smoke \
            --read-only --tmpfs /tmp --user 65532:65532 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e DAD_JOKE_MONGODB_URI=mongodb://dj-release-mongo:27017 \
            -e DAD_JOKE_MONGODB_DATABASE=dadjoke_arm \
            -e DAD_JOKE_HTTP_ADDR=:8080 \
            -e COOKIE_SECURE=false \
            -e ALLOW_SIGNUP=false \
            "${plat_ref}")"
          ok=0
          for i in $(seq 1 60); do
            ip="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${cid}")"
            if [[ -n "${ip}" ]] && docker run --rm --network dj-release-smoke curlimages/curl:8.12.1 \
              -fsS "http://${ip}/healthz" | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 3
          done
          docker logs "${cid}" || true
          test "${ok}" = "1"
          docker rm -f "${cid}" >/dev/null

      - name: Promote verified digest to v* and latest
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          tag="${{ steps.meta.outputs.tag }}"
          digest="${{ steps.digest.outputs.digest }}"
          ref="${img}@${digest}"
          docker buildx imagetools create \
            -t "${img}:${tag}" \
            -t "${img}:latest" \
            "${ref}"

          # Assert both tags resolve to the exact verified multi-arch digest.
          tag_digest="$(docker buildx imagetools inspect "${img}:${tag}" | awk '/^Digest:/{print $2; exit}')"
          latest_digest="$(docker buildx imagetools inspect "${img}:latest" | awk '/^Digest:/{print $2; exit}')"
          echo "candidate=${digest}"
          echo "tag=${tag_digest}"
          echo "latest=${latest_digest}"
          test "${tag_digest}" = "${digest}"
          test "${latest_digest}" = "${digest}"

          docker buildx imagetools inspect "${img}:${tag}" | tee /tmp/inspect-tag.txt
          grep -q 'linux/amd64' /tmp/inspect-tag.txt
          grep -q 'linux/arm64' /tmp/inspect-tag.txt

      - name: Cleanup smoke containers
        if: always()
        run: |
          docker rm -f dj-release-server dj-release-server-arm dj-release-mongo >/dev/null 2>&1 || true
          docker network rm dj-release-smoke >/dev/null 2>&1 || true
