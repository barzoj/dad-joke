name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-generate:
    name: Generate & test (linux-amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Generate API (TypeSpec + oapi-codegen)
        run: make generate

      - name: Vet
        run: go vet ./...

      - name: Unit tests (race) + DAL integration
        env:
          CGO_ENABLED: "1"
          DAD_JOKE_MONGODB_URI: mongodb://127.0.0.1:27017
        run: go test -race ./...

  test-and-build:
    name: Test & build (windows-amd64)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Generate API (TypeSpec + oapi-codegen)
        run: |
          npm ci
          npm run generate:typespec
          New-Item -ItemType Directory -Force -Path gen/go/agentapi, gen/go/controlapi | Out-Null
          go generate ./api

      - name: Vet
        run: go vet ./...

      # CGO is disabled for the static Windows binary; the race detector requires
      # CGO, so we run tests without -race on windows-latest.
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -v ./...

      - name: Resolve build metadata
        id: meta
        run: |
          $version = "0.0.1-dev"
          $commit = (git rev-parse --short HEAD).Trim()
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Build dad-joke.exe with ldflags
        run: |
          .\scripts\build.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Commit "${{ steps.meta.outputs.commit }}" `
            -Output "dad-joke.exe"

      - name: Verify version subcommand (smoke)
        run: |
          $out = (& .\dad-joke.exe version | Out-String).Trim()
          $want = "dad-joke ${{ steps.meta.outputs.version }} (commit ${{ steps.meta.outputs.commit }})"
          Write-Host "got:  $out"
          Write-Host "want: $want"
          if ($out -ne $want) {
            throw "version output mismatch"
          }

      - name: Package release artifacts (dry-run for AC-03)
        run: |
          .\scripts\package-release.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Commit "${{ steps.meta.outputs.commit }}" `
            -DistDir "dist" `
            -Tag "v0.0.1-dev"

      - name: E2E acceptance tests
        env:
          CGO_ENABLED: "0"
          DAD_JOKE_BIN: ${{ github.workspace }}\dad-joke.exe
          DAD_JOKE_DIST: ${{ github.workspace }}\dist
          DAD_JOKE_EXPECT_VERSION: ${{ steps.meta.outputs.version }}
          DAD_JOKE_EXPECT_COMMIT: ${{ steps.meta.outputs.commit }}
        # TC-03..TC-05 include self-update + health windows; allow ample time.
        run: go test -tags=e2e -v -timeout 20m ./e2e/...

  coverage:
    name: Coverage (linux-amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # sticky PR coverage comment (soft-fail on fork / read-only tokens)
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Generate API (TypeSpec + oapi-codegen)
        run: make generate

      - name: Unit tests with race + coverage
        env:
          CGO_ENABLED: "1"
          DAD_JOKE_MONGODB_URI: mongodb://127.0.0.1:27017
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Test coverage reporter
        run: python3 scripts/coverage-report_test.py

      - name: List changed Go files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          : > changed-go.txt
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRTUXB \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
              -- '*.go' \
              | grep -vE '(^|/)gen/' \
              | tee changed-go.txt \
              || true
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMRTUXB \
              "${{ github.event.before }}...${{ github.sha }}" \
              -- '*.go' \
              | grep -vE '(^|/)gen/' \
              | tee changed-go.txt \
              || true
          fi

      - name: Coverage report + internal/ threshold
        id: report
        shell: bash
        run: |
          set -euo pipefail
          # Floor is slightly below measured internal/ coverage on linux/amd64 (~71%)
          # so CI gates regression without flaking on small platform variance.
          python3 scripts/coverage-report.py \
            --profile coverage.out \
            --internal-min 70 \
            --summary "${GITHUB_STEP_SUMMARY}" \
            --comment coverage-comment.md \
            --badge coverage.json \
            --changed-files changed-go.txt

      - name: Sticky PR coverage comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          header: coverage
          path: coverage-comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage badge artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-badge
          path: coverage.json
          if-no-files-found: error

  publish-coverage-badge:
    name: Publish coverage badge
    needs: [coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push coverage.json to the orphan `badges` branch only

    steps:
      - name: Download coverage badge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-badge
          path: badge

      - name: Publish coverage badge (badges branch)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # shields.io endpoint JSON lives on an orphan `badges` branch so badge
          # updates never retrigger CI on main and need no third-party secrets.
          badge_src="${GITHUB_WORKSPACE}/badge/coverage.json"
          work=$(mktemp -d)
          auth_remote="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"

          git clone --depth 1 --branch badges "$auth_remote" "$work" 2>/dev/null \
            || (
              mkdir -p "$work"
              cd "$work"
              git init
              git checkout -b badges
              git remote add origin "$auth_remote"
            )

          cp "$badge_src" "$work/coverage.json"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          git commit -m "chore: update coverage badge"
          git push -u origin HEAD:badges
