name: Policy spike (T-24)

# Isolated from ci.yml — does not modify or slow existing jobs.
on:
  pull_request:
    paths:
      - "e2e/policy-spike/**"
      - "docs/policy-spike-findings.md"
      - ".github/workflows/policy-spike.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-spike:
    name: Native policy spike (windows-2025)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run policy spike E2E
        env:
          CGO_ENABLED: "0"
          POLICY_SPIKE_OUT: ${{ github.workspace }}\spike-out
        run: |
          New-Item -ItemType Directory -Force -Path $env:POLICY_SPIKE_OUT | Out-Null
          go test -tags=spike -v -count=1 -timeout 45m ./e2e/policy-spike/...

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-spike-findings
          path: |
            spike-out/policy-spike-findings.json
            spike-out/policy-spike-findings.generated.md
          if-no-files-found: warn
